<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embed Inkfang</title>
  <style>
    body{margin:0;background:#f1f1e7;color:#132b36;font:18px/1.6 system-ui,sans-serif}
    header,footer{max-width:1050px;padding:24px;margin:auto}h1{margin:0;font-size:32px}
    iframe{display:block;width:100%;height:900px;height:90svh;min-height:600px;border:0;background:#132b36}
    a{color:inherit;font-weight:700}p{margin:8px 0}
  </style>
</head>
<body>
  <header><h1>Inkfang · English with teeth.</h1><p>A working embed example. Replace both <code>../dist/</code> URLs with your hosted game URL when using this on another website.</p></header>
  <!-- Microphone access still requires the player's browser permission. -->
  <iframe src="../dist/" title="Inkfang English learning game" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe>
  <footer><a href="../dist/" target="_blank" rel="noopener">Open Inkfang in its own tab ↗</a><p>If your website blocks microphone use inside a frame, use the link above.</p></footer>
</body>
</html>
